set_tou_periods:
  name: Set TOU periods
  description: Replace the EMMA time-of-use schedule (maximum 14 periods; an empty list clears it).
  fields:
    config_entry_id:
      name: Config entry ID
      description: The config entry ID shown in Home Assistant diagnostics.
      required: true
      selector:
        text:
    periods:
      name: Periods
      description: List of 0-14 periods with start_time, end_time, action, and seven Mon-Sun booleans.
      required: true
      example:
        - start_time: "00:00"
          end_time: "06:00"
          action: charge
          days: [true, true, true, true, true, true, true]
      selector:
        object:

read_time_segments:
  name: Read time segments
  description: Return the nine-slot BESS/Growatt-compatible view of the EMMA TOU schedule.
  fields:
    device_id:
      name: Device
      description: Any device belonging to the Huawei EMMA Management config entry.
      required: true
      selector:
        device:
          integration: huawei_emma_management

update_time_segment:
  name: Update time segment
  description: Update one BESS/Growatt-compatible time slot and immediately write the complete EMMA TOU schedule.
  fields:
    device_id:
      name: Device
      required: true
      selector:
        device:
          integration: huawei_emma_management
    segment_id:
      name: Segment
      description: Compatibility segment number (1-9).
      required: true
      selector:
        number:
          min: 1
          max: 9
          mode: box
    batt_mode:
      name: Battery mode
      required: true
      selector:
        select:
          options:
            - load_first
            - battery_first
            - grid_first
    start_time:
      name: Start time
      required: true
      example: "00:00"
      selector:
        time:
    end_time:
      name: End time
      required: true
      example: "06:00"
      selector:
        time:
    enabled:
      name: Enabled
      required: true
      selector:
        boolean:
