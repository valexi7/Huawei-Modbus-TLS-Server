# Compile-only configuration used by CI. Builds the components and board
# package from this checkout instead of the published GitHub sources.
# Secrets are placeholders generated by the workflow; never flash this image.

substitutions:
  emma_eth_ip: "192.168.88.20"
  emma_eth_gateway: "192.168.88.1"
  emma_eth_subnet: "255.255.255.0"
  read_only: "false"

packages:
  huawei_emma_board: !include packages/lilygo-t-eth-elite-dual-network.yaml

external_components:
  - source:
      type: local
      path: components

esphome:
  name: emma-ci-build

logger:

wifi:
  ssid: "ci-build"
  password: "ci-build-password"

huawei_emma_reverse:
  id: emma_connector
  ethernet_id: emma_ethernet
  activity_output_id: led_output
  read_only: ${read_only}
  api_token: "0123456789abcdef0123456789abcdef"
  certificate: !secret emma_tls_certificate
  private_key: !secret emma_tls_private_key
